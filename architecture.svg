<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 280" width="100%" height="100%" style="background:#0b0f19; font-family:'Outfit', 'Inter', -apple-system, sans-serif; border-radius:12px; border:1px solid #1e293b;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="red-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>
    <linearGradient id="blue-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="purple-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#6b21a8" />
    </linearGradient>
    <linearGradient id="emerald-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Filters for Glows -->
    <filter id="glow-red" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-blue" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-purple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-emerald" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Background -->
  <rect width="920" height="280" rx="12" fill="url(#bg-grad)" />

  <!-- Animated Styles -->
  <style>
    @keyframes flow {
      to {
        stroke-dashoffset: -20;
      }
    }
    @keyframes pulse-red {
      0%, 100% { filter: drop-shadow(0 0 2px rgba(244,63,94,0.4)); }
      50% { filter: drop-shadow(0 0 8px rgba(244,63,94,0.8)); }
    }
    @keyframes pulse-blue {
      0%, 100% { filter: drop-shadow(0 0 2px rgba(59,130,246,0.4)); }
      50% { filter: drop-shadow(0 0 8px rgba(59,130,246,0.8)); }
    }
    @keyframes pulse-purple {
      0%, 100% { filter: drop-shadow(0 0 2px rgba(168,85,247,0.4)); }
      50% { filter: drop-shadow(0 0 8px rgba(168,85,247,0.8)); }
    }
    @keyframes pulse-emerald {
      0%, 100% { filter: drop-shadow(0 0 2px rgba(16,185,129,0.4)); }
      50% { filter: drop-shadow(0 0 8px rgba(16,185,129,0.8)); }
    }
    
    .flow-line {
      stroke-dasharray: 6, 4;
      animation: flow 0.8s linear infinite;
    }
    .node-red { animation: pulse-red 3s infinite ease-in-out; }
    .node-blue { animation: pulse-blue 3.2s infinite ease-in-out; }
    .node-purple { animation: pulse-purple 2.8s infinite ease-in-out; }
    .node-emerald { animation: pulse-emerald 3.4s infinite ease-in-out; }
    
    .title-text { fill: #f8fafc; font-size: 15px; font-weight: 700; letter-spacing: 0.5px; }
    .desc-text { fill: #94a3b8; font-size: 11px; }
    .tech-badge { font-size: 10px; font-weight: 600; fill: #e2e8f0; }
  </style>

  <!-- Flow Lines (Connections) -->
  <!-- Line 1 -> 2 -->
  <path d="M 190 140 L 260 140" stroke="#f43f5e" stroke-width="2.5" fill="none" class="flow-line" style="stroke: #f43f5e;" />
  <polygon points="262,140 254,135 254,145" fill="#f43f5e" />
  
  <!-- Line 2 -> 3 -->
  <path d="M 430 140 L 500 140" stroke="#3b82f6" stroke-width="2.5" fill="none" class="flow-line" style="stroke: #3b82f6;" />
  <polygon points="502,140 494,135 494,145" fill="#3b82f6" />
  
  <!-- Line 3 -> 4 -->
  <path d="M 670 140 L 740 140" stroke="#a855f7" stroke-width="2.5" fill="none" class="flow-line" style="stroke: #a855f7;" />
  <polygon points="742,140 734,135 734,145" fill="#a855f7" />

  <!-- ================= NODE 1: LOG INGEST ================= -->
  <g class="node-red" transform="translate(40, 85)">
    <!-- Glow and Rect -->
    <rect width="150" height="110" rx="10" fill="#111827" stroke="url(#red-grad)" stroke-width="1.5" />
    <!-- Header Icon/Color strip -->
    <path d="M 2 10 Q 2 2 10 2 L 140 2 Q 148 2 148 10 L 148 15 L 2 15 Z" fill="url(#red-grad)" />
    <!-- Text -->
    <text x="15" y="40" class="title-text">Log Ingestion</text>
    <text x="15" y="60" class="desc-text">CSV Event Logs</text>
    <text x="15" y="75" class="desc-text">(Time, Source, Event)</text>
    <!-- Tech Tag -->
    <rect x="15" y="87" width="65" height="16" rx="4" fill="#be123c" opacity="0.3" />
    <text x="21" y="99" class="tech-badge">SECURITY.CSV</text>
  </g>

  <!-- ================= NODE 2: FASTAPI BACKEND ================= -->
  <g class="node-blue" transform="translate(260, 85)">
    <!-- Glow and Rect -->
    <rect width="170" height="110" rx="10" fill="#111827" stroke="url(#blue-grad)" stroke-width="1.5" />
    <!-- Header strip -->
    <path d="M 2 10 Q 2 2 10 2 L 160 2 Q 168 2 168 10 L 168 15 L 2 15 Z" fill="url(#blue-grad)" />
    <!-- Text -->
    <text x="15" y="40" class="title-text">FastAPI Ingest</text>
    <text x="15" y="60" class="desc-text">Validates schema,</text>
    <text x="15" y="75" class="desc-text">parses events via Pandas</text>
    <!-- Tech Tag -->
    <rect x="15" y="87" width="90" height="16" rx="4" fill="#1d4ed8" opacity="0.3" />
    <text x="21" y="99" class="tech-badge">FASTAPI / PANDAS</text>
  </g>

  <!-- ================= NODE 3: AI ENGINE ================= -->
  <g class="node-purple" transform="translate(500, 85)">
    <!-- Glow and Rect -->
    <rect width="170" height="110" rx="10" fill="#111827" stroke="url(#purple-grad)" stroke-width="1.5" />
    <!-- Header strip -->
    <path d="M 2 10 Q 2 2 10 2 L 160 2 Q 168 2 168 10 L 168 15 L 2 15 Z" fill="url(#purple-grad)" />
    <!-- Text -->
    <text x="15" y="40" class="title-text">Threat Analysis</text>
    <text x="15" y="60" class="desc-text">Evaluates intent, risks,</text>
    <text x="15" y="75" class="desc-text">generates attack graph</text>
    <!-- Tech Tag -->
    <rect x="15" y="87" width="80" height="16" rx="4" fill="#6b21a8" opacity="0.3" />
    <text x="21" y="99" class="tech-badge">AI CORRELATION</text>
  </g>

  <!-- ================= NODE 4: FRONTEND UI ================= -->
  <g class="node-emerald" transform="translate(730, 85)">
    <!-- Glow and Rect -->
    <rect width="150" height="110" rx="10" fill="#111827" stroke="url(#emerald-grad)" stroke-width="1.5" />
    <!-- Header strip -->
    <path d="M 2 10 Q 2 2 10 2 L 140 2 Q 148 2 148 10 L 148 15 L 2 15 Z" fill="url(#emerald-grad)" />
    <!-- Text -->
    <text x="15" y="40" class="title-text">DFIR Dashboard</text>
    <text x="15" y="60" class="desc-text">Interactive charts,</text>
    <text x="15" y="75" class="desc-text">Node-Edge Flowchart</text>
    <!-- Tech Tag -->
    <rect x="15" y="87" width="95" height="16" rx="4" fill="#047857" opacity="0.3" />
    <text x="21" y="99" class="tech-badge">REACT / TANSTACK</text>
  </g>
</svg>
